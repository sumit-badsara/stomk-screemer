<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#FFD43B" stroke="#1a1a1a" stroke-width="3.5"/>
  <!-- Stock chart line that becomes a face profile: forehead→nose→mouth gap→jaw -->
  <path d="M 8 46 L 12 40 L 15 42 L 18 34
           C 18 22 20 14 27 14
           C 32 14 33 18 33 24
           L 33 27
           C 35 27 37 28.5 37 31
           L 37 33"
        stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Jaw line (gap = open mouth) -->
  <path d="M 37 38 L 35 41 C 33 45 29 48 24 48 L 18 48"
        stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Eye -->
  <circle cx="27" cy="23" r="2.2" fill="#1a1a1a"/>
  <!-- Rupee symbol -->
  <path d="M 44 30 h 8 M 44 34 h 8 M 46 30 C 50 30 51 37 46 38 L 52 44"
        stroke="#16a34a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
