<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="3.5"/>
  <!-- Face silhouette carved out as cream negative space -->
  <path d="M 16 50 L 16 24
           C 16 15 21 12 27 13.5
           C 31 14.5 32 19 32 23
           L 32 26
           C 34 26 36.5 28 36.5 31
           L 36.5 33
           L 34 33
           L 34 35
           L 36.5 35
           L 36.5 37
           L 34 39
           C 32 43 28 48 22 50 Z"
        fill="#FFFDF5"/>
  <!-- Eye -->
  <circle cx="24.5" cy="23" r="2" fill="#1a1a1a"/>
  <!-- Mouth cavity (dark, inside the cream face) -->
  <rect x="34" y="33" width="2.5" height="2" fill="#1a1a1a" rx="0.5"/>
  <!-- Rupee bursting out from the mouth -->
  <path d="M 41 29 h 7 M 41 33 h 7 M 43 29 C 46.5 29 47.5 35.5 43 36.5 L 48 42"
        stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small trend sparkle -->
  <circle cx="53" cy="24" r="1.2" fill="#FFD43B"/>
  <circle cx="56" cy="28" r="0.8" fill="#FFD43B" opacity="0.6"/>
</svg>
