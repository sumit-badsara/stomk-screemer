<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#FFFDF5" stroke="#1a1a1a" stroke-width="3.5"/>
  <!-- Upper head block -->
  <path d="M 10 12 C 10 10 14 8 20 10 C 26 12 30 16 30 22 L 30 28 L 10 28 Z"
        fill="#1a1a1a"/>
  <!-- Lower jaw block -->
  <path d="M 10 36 L 30 36 L 30 40 C 30 46 24 52 16 52 L 10 52 Z"
        fill="#1a1a1a"/>
  <!-- Eye (knocked out of upper block) -->
  <circle cx="20" cy="20" r="2.5" fill="#FFFDF5"/>
  <!-- The scream = the gap between blocks (y=28 to y=36) -->
  <!-- Rupee in the scream gap, large and bold -->
  <path d="M 32 28 h 9 M 32 32 h 9 M 34 28 C 38 28 39 35 34 36 L 40 42"
        stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Smaller rupee -->
  <path d="M 46 24 h 6 M 46 27 h 6 M 47.5 24 C 50 24 50.5 29 47.5 29.5 L 52 34"
        stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  <!-- Trend line below -->
  <path d="M 8 57 L 18 54 L 28 55.5 L 38 51 L 48 52.5 L 58 48"
        stroke="#1a1a1a" stroke-width="1.2" stroke-linecap="round" opacity="0.12"/>
</svg>
